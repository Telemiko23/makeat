name: Sync labels
on:
  push:
    branches: [main]
    paths: [.github/labels.yml]
  workflow_dispatch:
permissions:
  issues: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create or update role labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -oP '(?<=name: ).*' .github/labels.yml | while read -r name; do
            gh label create "$name" --color 2f6b4f --force --repo "$GITHUB_REPOSITORY"
          done
